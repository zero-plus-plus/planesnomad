# =====================================================================================
#  Planesnomad theme: DEFAULT (the built-in look) - also the reference for every setting
# =====================================================================================
#
#  To make a theme: copy this folder (e.g. to themes/my-theme/), change the name below,
#  and change only what you want. Anything you leave out comes from this default theme.
#  In the viewer: Theme menu -> pick it; press F5 to reload after editing files.
#  Full guide: themes/README.md
#
#  Values:
#    colors   #RRGGBB or #AARRGGBB (AA = opacity, 00 clear .. FF solid), or "none"
#    sizes    pixels at a 1280x720 window (everything scales with the window)
#    files    paths relative to this theme's folder (png/jpg for pictures, ttf/otf for fonts)
#  Lines starting with # are comments. Settings below that are commented out show the
#  default behavior; remove the # to set them.

name = Default
# extends = default        (other themes: the theme to start from; default if left out)

# -------------------------------------------------------------------------------------
#  Colors
# -------------------------------------------------------------------------------------
color.table      = #1E2A24     # your half of the table (without a playmat)
color.tableEnemy = #22262E     # the enemy's half of the table
color.midline    = #6B7F73     # line between the two halves
color.panel      = #15181D     # side panels, pop-ups, columns
color.panelEdge  = #2C323B     # thin dividers and outlines
color.topbar     = #101317     # top bar (relics, turn, controls)
color.text       = #E8E4D8     # main text
color.textDim    = #9AA0A8     # secondary text, labels, hints
color.accent     = #E3B341     # highlights: hovered card, selections, "Led to" markers
color.you        = #4F9D69     # your side: names, outlines of your stack items and history
color.enemy      = #C4544B     # the enemy's side
color.life       = #E0605A     # life totals
color.attacking  = #FF6B4A     # outline of attacking creatures
color.blocking   = #58A6FF     # outline of blocking creatures
color.damage     = #FF3B30     # damage markers on cards
color.relicGlow  = #FFE08A     # glow of a relic you can use right now
color.relicUsed  = #5A5F66     # a used relic (greyed out)

# History bar symbol discs (history icons), one color per kind of event
color.history.cast    = #6C7A89
color.history.ability = #5B7FA6
color.history.trigger = #C9952C
color.history.land    = #6B8E4E
color.history.attack  = #D9603B
color.history.block   = #3F7CC4
color.history.death   = #5C4B6B
color.history.exile   = #8E6CC9
color.history.bounce  = #2F9C95
color.history.tokens  = #4E9A5A
color.history.damage  = #C23B3B
color.history.gameEnd = #D4AF37

# Frame colors of cards drawn without a picture (text frames)
card.frame.W         = #E9E2C8
card.frame.U         = #3A7BC8
card.frame.B         = #4A4048
card.frame.R         = #C8503A
card.frame.G         = #3F8F4E
card.frame.multi     = #C9A646
card.frame.colorless = #9EA3A8
card.frame.land      = #8C7A5B

# -------------------------------------------------------------------------------------
#  Fonts
#  A font file in the theme (fonts/MyFont.ttf) or installed font names, first found wins:
#    font.heading = fonts/Cinzel-Bold.ttf
#    font.body    = Book Antiqua, Palatino Linotype, Georgia, Serif
# -------------------------------------------------------------------------------------
# font.body     = SansSerif    # most text
# font.heading  = SansSerif    # names, titles, labels (bold text)
# font.numbers  = SansSerif    # life totals, counts ("x200"); defaults to the heading font
font.scale      = 1.0          # all text bigger (1.2) or smaller (0.9)

# -------------------------------------------------------------------------------------
#  Elements (the swappable parts of the screen)
#
#  Each element can be drawn from a picture, or from fill + border + rounding:
#    <element>.image       = frames/popup.png
#    <element>.mode        = slice     9-slice: corners keep their size, edges/middle stretch
#                            stretch   the picture is stretched to fit
#                            cover     fills the area, keeps proportions, crops the overflow
#                            tile      repeated (textures); <element>.tileScale = 1.0
#    <element>.slice       = 24,24,24,24   slice mode: corner sizes in the picture (top,left,bottom,right)
#    <element>.sliceScale  = 1.0           slice mode: corner size on screen (1.0 = picture pixels at 1280x720)
#    <element>.fill        = #15181D       background (also drawn behind a picture with see-through parts)
#    <element>.border      = #2C323B       border color, "none" for no border
#    <element>.borderWidth = 2
#    <element>.radius      = 6             corner rounding; "pill" = round ends
#    <element>.text        = #E8E4D8       text color on the element (where text is drawn on it)
#
#  Elements and what they are:
#    table.you, table.enemy    each half of the table, when the player has no playmat
#    hand                      strip behind each hand (default: translucent black)
#    panel                     left column: player panels, pinned preview
#    column                    right column: history bar, stack & game log
#    topbar                    top bar (relics, consumables, turn, controls)
#    popup                     hover pop-ups: player info, history entries
#                              popup.padding = 10 (space inside); popup.sideBorder = true (border
#                              in the color of the player it is about; set false to keep your border)
#    inspect                   text panel beside an inspected card (hover, Q)
#    choice                    panel showing cards to decide about (scry, surveil) in the middle of the board
#    phases                    the column of phase icons left of the battlefield (stops)
#    prompt                    the bar above your hand while you play ("Your turn: play something, or
#                              pass  [Pass]"); prompt.padding = 10 (space inside)
#    stack                     the stack pop-up on the board
#    badge.life                life total on the portrait
#    badge.count               counts on piles and history icons ("x200")
#    badge.selected            a pile's selection count ("37/200")
#    tag                       small labels on stack cards ("Ability", "Trigger")
#    button, button.hover, button.pressed, button.disabled    top bar buttons
#    relic.slot                circle behind relic pictures
#    relic.frame, consumable.frame   picture drawn over relic / consumable icons (e.g. a gold ring);
#                              <element>.extend = 0.12 (how far it reaches past the icon)
#    consumable.empty          an empty consumable slot (default: dashed outline)
#
#  The default look of every element comes from the colors above, so it is left unset here.
#  Examples:
#    popup.image = frames/gold-frame.png
#    popup.slice = 22,22,22,22
#    popup.padding = 16
#    stack.radius = 12
#    button.text = #F3D98A
# -------------------------------------------------------------------------------------

# -------------------------------------------------------------------------------------
#  Icons (pictures replacing drawn symbols; square, transparent background, any size)
#    icon.collapse         top bar "collapse" arrow       icon.expand    "expand" arrow
#    icon.phase.upkeep     icon.phase.draw        icon.phase.main1       icon.phase.combatBegin
#    icon.phase.attackers  icon.phase.blockers    icon.phase.firstStrike icon.phase.damage
#    icon.phase.combatEnd  icon.phase.main2       icon.phase.end         icon.phase.cleanup
#    icon.history.cast     icon.history.ability    icon.history.trigger   icon.history.land
#    icon.history.attack   icon.history.block      icon.history.death     icon.history.exile
#    icon.history.bounce   icon.history.tokens     icon.history.damage    icon.history.gameEnd
# -------------------------------------------------------------------------------------
