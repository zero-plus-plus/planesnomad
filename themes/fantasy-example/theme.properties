# =====================================================================================
#  Planesnomad theme: FANTASY EXAMPLE
#  A demonstration of swappable elements: leather and wood textures, gold frames, serif
#  fonts. The pictures were generated by code (ExampleThemeAssets) as placeholders - a
#  designer would replace them with painted art of the same names.
#  Every setting is explained in themes/default/theme.properties.
# =====================================================================================

name = Fantasy (example)
extends = default

# Colors: warm parchment text, gold accents
color.panel      = #241913
color.panelEdge  = #6E5418
color.topbar     = #1E140D
color.text       = #F1E6CC
color.textDim    = #BFA982
color.accent     = #F3D98A
color.you        = #6FB37A
color.enemy      = #D0584A
color.life       = #F07A62
color.midline    = #C9A23F

# Fonts: installed serif fonts, first one found wins
font.heading = Book Antiqua, Palatino Linotype, Palatino, Georgia, Serif
font.body    = Georgia, Book Antiqua, Serif
font.numbers = Book Antiqua, Georgia, Serif

# Table halves (shown when a player has no playmat)
table.you.image   = textures/felt-green.png
table.you.mode    = tile
table.enemy.image = textures/felt-crimson.png
table.enemy.mode  = tile

# Side panels and columns: leather
panel.image  = textures/leather.png
panel.mode   = tile
column.image = textures/leather.png
column.mode  = tile

# Top bar: wood
topbar.image = textures/wood.png
topbar.mode  = tile

# Pop-ups and the inspect panel: ornate gold frame (9-slice)
popup.image      = frames/gold-frame.png
popup.slice      = 26,26,26,26
popup.sliceScale = 0.8
popup.padding    = 18
popup.sideBorder = false
popup.fill       = none
inspect.image    = frames/gold-frame.png
inspect.slice    = 26,26,26,26
inspect.sliceScale = 0.7
inspect.fill     = none

# Stack pop-up: thin gold frame
stack.image      = frames/gold-frame-thin.png
stack.slice      = 18,18,18,18
stack.sliceScale = 0.8
stack.fill       = none

# Badges
badge.life.image  = frames/badge-life.png
badge.life.mode   = slice
badge.life.slice  = 14,16,14,16
badge.life.fill   = none
badge.life.text   = #F3D98A
badge.count.image = frames/badge-count.png
badge.count.slice = 10,12,10,12
badge.count.fill  = none
badge.count.text  = #F3D98A

# Buttons: bronze
button.image          = frames/button.png
button.slice          = 8,8,8,8
button.fill           = none
button.text           = #F3D98A
button.hover.image    = frames/button-hover.png
button.hover.slice    = 8,8,8,8
button.hover.fill     = none
button.pressed.image  = frames/button-pressed.png
button.pressed.slice  = 8,8,8,8
button.pressed.fill   = none
button.disabled.image = frames/button-disabled.png
button.disabled.slice = 8,8,8,8
button.disabled.fill  = none
button.disabled.text  = #7A6A52

# Relics: a gold ring over each icon
relic.slot.fill    = #3B2A1C
relic.frame.image  = frames/relic-ring.png
relic.frame.mode   = stretch
relic.frame.extend = 0.14
